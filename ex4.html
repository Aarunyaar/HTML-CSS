<!DOCTYPE html>
<html>
<head>
    <title>Small Shop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">MyShop</a>
  </div>
</nav>

<div id="slider" class="carousel slide" data-bs-ride="carousel">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="https://via.placeholder.com/1200x300?text=Welcome+to+MyShop" class="d-block w-100">
    </div>
  </div>
</div>

<div class="container my-4 text-center">
  <h3>Popular Product</h3>

  <div class="card mx-auto" style="width: 18rem;">
    <img src="https://via.placeholder.com/300x200?text=Product" class="card-img-top">
    <div class="card-body">
      <h5 class="card-title">Product Name</h5>
      <p class="card-text">$30</p>

      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#buyBox">
        Buy
      </button>
    </div>
  </div>
</div>

<div class="modal fade" id="buyBox">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-body text-center">
        <h5>Do you want to buy this item?</h5>
        <button class="btn btn-success mt-2" data-bs-dismiss="modal">Yes</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
