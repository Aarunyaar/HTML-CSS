<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script> 
</head>
<body>
    <h2>Layout 1</h2>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12 " style="background-color: lightblue;"> top</div>
        </div>
        <div class="row">
            <div class="col-12 " style="background-color: rgb(100, 86, 86);">bottom</div>
        </div>
    </div>
    <br>
    <br>
    <h2>Layout 2</h2>
    <div class="container-fluid">
        <div class="row">
            <div class="col-6" style="background-color: lightblue;">left</div>
            <div class="col-6" style="background-color: beige;">right</div>
        </div>
    </div>
    <br>
    <br>
    <h2>Layout3</h2>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12" style="background-color: aqua;">top</div>
        </div>
        <div class="row">
            <div class="col-6" style="background-color:green">bottom-left</div>
            <div class="col-6" style="background-color: brown;">bottom-right</div>
        </div>
    </div>
    <br>
    <br>
    <h2>Layout 4</h2>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12" style="background-color: aqua;">top</div>
        </div>
        <div class="row">
            <div class="col-6" style="background-color:green">bottom-left</div>
            <div class="col-6" >
                <div class="row">
                    <div class="col-12" style="background-color: blueviolet;">innertop</div>
                </div>
                <div class="row">
                    <div class="col-6" style="background-color: rgb(80, 68, 68);">inner bottom left</div>
                    <div class="col-6" style="background-color: rgb(68, 100, 68);">inner bottom right</div>
                </div>
            </div>
        </div>
    </div>
    <br>
    <br>
    <h2>Layout 5</h2>
     <div class="container-fluid">
        <div class="row">
            <div class="col-6" style="background-color: lightblue;">left</div>
            <div class="col-6">
                <div class="row">
                    <div class="col-12" style="background-color: green;">left-top</div>
                </div>
                <div class="row">
                    <div class="col-6" style="background-color: blueviolet;">left-bottom-left</div>
                    <div class="col-6">
                        <div class="row">
                            <div class="col-12" style="background-color: palevioletred;">inner right row</div>
                            <div class="col-12" style="background-color: yellow;">inner right bottom</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
